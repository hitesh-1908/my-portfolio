<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="apiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#04060a" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" rx="10" fill="url(#apiBg)" stroke="#1e293b" stroke-width="2" />
  <rect width="800" height="38" rx="10" fill="#161b22" />
  <circle cx="24" cy="19" r="6" fill="#ff5f56" />
  <circle cx="44" cy="19" r="6" fill="#ffbd2e" />
  <circle cx="64" cy="19" r="6" fill="#27c93f" />
  <text x="400" y="24" fill="#94a3b8" font-family="monospace" font-size="12" text-anchor="middle">secure-rest-api — JWT &amp; Docker Security Gateway</text>
  
  <rect x="25" y="55" width="750" height="420" rx="6" fill="#0b1120" stroke="#1e293b" />
  <text x="45" y="90" fill="#bf5fff" font-family="monospace" font-weight="bold" font-size="13">SWAGGER OPENAPI 3.0 &#x2014; SECURITY PIPELINE SPEC</text>
  
  <!-- Endpoint 1 -->
  <rect x="45" y="110" width="710" height="55" rx="4" fill="#152438" stroke="#0284c7" />
  <rect x="55" y="122" width="60" height="30" rx="3" fill="#0284c7" />
  <text x="85" y="142" fill="#ffffff" font-family="monospace" font-weight="bold" font-size="12" text-anchor="middle">POST</text>
  <text x="130" y="142" fill="#e2e8f0" font-family="monospace" font-size="13">/api/v1/auth/authenticate</text>
  <text x="630" y="142" fill="#00ff41" font-family="monospace" font-size="11">Bearer Token Gen</text>

  <!-- Endpoint 2 -->
  <rect x="45" y="180" width="710" height="55" rx="4" fill="#152438" stroke="#0284c7" />
  <rect x="55" y="192" width="60" height="30" rx="3" fill="#0284c7" />
  <text x="85" y="212" fill="#ffffff" font-family="monospace" font-weight="bold" font-size="12" text-anchor="middle">POST</text>
  <text x="130" y="212" fill="#e2e8f0" font-family="monospace" font-size="13">/api/v1/auth/refresh-token</text>
  <text x="630" y="212" fill="#ffb700" font-family="monospace" font-size="11">RTR Protected</text>

  <!-- Endpoint 3 -->
  <rect x="45" y="250" width="710" height="55" rx="4" fill="#0f291e" stroke="#047857" />
  <rect x="55" y="262" width="60" height="30" rx="3" fill="#047857" />
  <text x="85" y="282" fill="#ffffff" font-family="monospace" font-weight="bold" font-size="12" text-anchor="middle">GET</text>
  <text x="130" y="282" fill="#e2e8f0" font-family="monospace" font-size="13">/api/v1/management/metrics</text>
  <text x="630" y="282" fill="#00ff41" font-family="monospace" font-size="11">ROLE_ADMIN</text>

  <!-- Docker Container logs -->
  <rect x="45" y="325" width="710" height="135" rx="4" fill="#030712" stroke="#1f2937" />
  <text x="60" y="350" fill="#64748b" font-family="monospace" font-size="11">$ docker-compose up -d &amp;&amp; docker logs -f api-gateway</text>
  <text x="60" y="375" fill="#00ff41" font-family="monospace" font-size="11">[Container] redis-cache:6379 &#x2014; RateLimiter ready (100 req/min/IP)</text>
  <text x="60" y="400" fill="#00e5ff" font-family="monospace" font-size="11">[Security]  JwtAuthenticationFilter initialized with RS256 algorithm</text>
  <text x="60" y="425" fill="#10b981" font-family="monospace" font-size="11">[Server]    Started Application in 2.148 seconds (JVM running for 2.651s)</text>
  <text x="60" y="445" fill="#e2e8f0" font-family="monospace" font-size="11">Tomcat initialized with port(s): 8080 (http)</text>
</svg>
